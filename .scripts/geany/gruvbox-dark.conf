[theme_info]
name=custom
description=Retro groove color scheme for programmers.
version=1.0.0
author=Isabelinc
compat=1.22;1.23;1.23.1;1.24

[named_colors]
bg0=#282828
bg1=#3c3836
bg2=#504945
bg3=#665c54
bg4=#7c6f64
fg0=#fbf1c7
fg1=#ebdbb2
fg2=#d5c4a1
fg3=#bdae93
fg4=#a89984
gray=#928374
red=#fb4934
green=#b8bb26
yellow=#fabd2f
blue=#83a598
purple=#d3869b
aqua=#8ec07c
orange=#fe8019

[named_styles]
operator=blue
default=fg1;bg0;false;false
error=red;yellow;false;true
op=blue;bg0;true;false
# Editor UI
#  selection: words; background
selection=purple;blue;false;false
current_line=;bg1;true
brace_good=green;bg3;true;true
brace_bad=red;bg3;true;true
margin_line_number=fg4;bg0
margin_folding=fg4;bg1
fold_symbol_highlight=fg1
indent_guide=bg3
caret=fg1;;false
marker_line=yellow;yellow
marker_search=bg0;blue
marker_mark=green;bg1
call_tips=bg3;fg1;false;false
white_space=bg3;;true

# Basic langs
comment=gray
comment_doc=comment
comment_line=gray
comment_line_doc=comment_doc
comment_doc_keyword=comment,bold
comment_doc_keyword_error=comment,italic

number=aqua
number_1=number
number_2=number_1

# class <color()>
type=purple;;false;true;

class=blue
# def <color():>
function=aqua;;false;true;
parameter=orange


keyword=default
# def, for, in
keyword_1=red;;false;true
keyword_2=default
keyword_3=orange
keyword_4=keyword_2

identifier=blue;;false;false
# main
identifier_1=fg2;;false;false
identifier_2=default
identifier_3=identifier_2
identifier_4=identifier_2

string=green;;false;false
string_1=orange;;false;false
string_2=green;;false;false
string_3=default
string_4=default
string_eol=string_1
character=string_1
backticks=string_2
here_doc=string_2

scalar=string_2
label=red
preprocessor=green
regex=purple
operator=purple;;true;false
decorator=orange
other=default
extra=keyword;

# Markup
tag=keyword
tag_unknown=tag,bold
tag_end=tag,bold
attribute=type
attribute_unknown=attribute,bold
value=number
entity=number

# Diff
line_added=green
line_removed=red
line_changed=preprocessor
