[theme_info]
name=custom
description=A comforting green theme with warm, organic tones.
version=1.0.0
author=Isabelinc
compat=1.22;1.23;1.23.1;1.24

[named_colors]
bg_dim=#232a2e
bg0=#2d353b
bg1=#343f44
bg2=#3d484d
bg3=#475257
bg4=#4f5b58
bg5=#56635f
fg=#d3c6aa
bg_red=#4c3743
bg_visual=#4c3a43
red=#e67e80
orange=#e69875
yellow=#dbbc7f
green=#a7c080
aqua=#83c092
blue=#7fbbb3
purple=#d699b6
grey0=#7a8478
grey1=#859289
grey2=#9da9a0

[named_styles]
operator=blue
default=fg;bg0;false;false
error=red;yellow;false;true
op=blue;bg0;true;false
# Editor UI
#  selection: words; background
selection=purple;blue;false;false
current_line=;bg1;true
brace_good=green;bg3;true;true
brace_bad=red;bg3;true;true
margin_line_number=grey1;bg0
margin_folding=grey1;bg1
fold_symbol_highlight=fg
indent_guide=bg3
caret=fg;;false
marker_line=yellow;yellow
marker_search=bg0;blue
marker_mark=green;bg1
call_tips=bg3;fg;false;false
white_space=bg3;;true

# Basic langs
comment=grey0
comment_doc=comment
comment_line=grey0
comment_line_doc=comment_doc
comment_doc_keyword=comment,bold
comment_doc_keyword_error=comment,italic

number=aqua
number_1=number
number_2=number_1

# class <color()>
type=purple;;false;true;

class=blue
# def <color():>
function=aqua;;false;true;
parameter=orange


keyword=default
# def, for, in
keyword_1=red;;false;true
keyword_2=default
keyword_3=orange
keyword_4=keyword_2

identifier=blue;;false;false
# main
identifier_1=grey2;;false;false
identifier_2=default
identifier_3=identifier_2
identifier_4=identifier_2

string=green;;false;false
string_1=orange;;false;false
string_2=green;;false;false
string_3=default
string_4=default
string_eol=string_1
character=string_1
backticks=string_2
here_doc=string_2

scalar=string_2
label=red
preprocessor=green
regex=purple
operator=purple;;true;false
decorator=orange
other=default
extra=keyword;

# Markup
tag=keyword
tag_unknown=tag,bold
tag_end=tag,bold
attribute=type
attribute_unknown=attribute,bold
value=number
entity=number

# Diff
line_added=green
line_removed=red
line_changed=preprocessor
