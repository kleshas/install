[global]
    ### Display ###
    monitor = 0
    follow = mouse
    width = 300
    height = 200
    origin = top-right
    offset = 10x50
    scale = 0
    notification_limit = 5

    ### Progress bar ###
    progress_bar = true
    progress_bar_height = 8
    progress_bar_frame_width = 1
    progress_bar_min_width = 150
    progress_bar_max_width = 300

    ### Text and Geometry ###
    indicate_hidden = yes
    transparency = 0
    separator_height = 2
    padding = 12
    horizontal_padding = 12
    text_icon_padding = 12
    frame_width = 2
    
    ### Catppuccin Macchiato Border Colors ###
    frame_color = "#8aadf4"
    separator_color = "#8aadf4"

    ### Sort and Miscellany ###
    sort = yes
    idle_threshold = 120
    font = JetBrains Mono 10
    line_height = 0
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    vertical_alignment = center
    show_age_threshold = 60
    ellipsize = middle
    ignore_newline = no
    stack_duplicates = true
    hide_duplicate_count = false
    show_indicators = yes

    ### Icons ###
    icon_position = left
    min_icon_size = 32
    max_icon_size = 64
    icon_path = /usr/share/icons/gnome/16x16/status/:/usr/share/icons/gnome/16x16/devices/

    ### History ###
    sticky_history = yes
    history_length = 20

    ### Misc anchoring ###
    dmenu = /usr/bin/dmenu -p dunst:
    browser = /usr/bin/xdg-open
    always_run_script = true
    title = Dunst
    class = Dunst
    corner_radius = 8
    cursor_type = left_ptr

[experimental]
    per_monitor_dpi = false

[urgency_low]
    # Background: Base, Foreground: Text, Frame: Blue
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#8aadf4"
    timeout = 5

[urgency_normal]
    # Background: Base, Foreground: Text, Frame: Blue
    background = "#24273a"
    foreground = "#cad3f5"
    frame_color = "#8aadf4"
    timeout = 10

[urgency_critical]
    # Background: Base, Foreground: Red, Frame: Red (for high visibility)
    background = "#24273a"
    foreground = "#ed8796"
    frame_color = "#ed8796"
    timeout = 0
