 ${goto 10}${color1}10TB ${goto 95}${color}${fs_type /mnt/10TB}${goto 155}${color}${execi 30 sudo smartctl -A /dev/sdc | awk 'FNR==22 {print $10}'}°C${goto 202}${color}${fs_used /mnt/10TB}${alignr}${fs_size /mnt/10TB} ${color}${fs_bar 10,40 /mnt/10TB}
