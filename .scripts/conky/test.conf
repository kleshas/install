 ${goto 10}${color5}${diskiograph_read 30,155} ${alignr}${color5}${diskiograph_write 30,155}
 ${goto 130}${color1}I/O read${alignr}I/O write
 ${goto 10}${color1}root${goto 130}${color}${diskio_read /dev/disk/by-uuid/5d37a37e-21c9-467a-96e7-11d349342c3f}/s${alignr}${color}${diskio_write /dev/mapper/root}/s
 ${goto 10}${color1}SN850${goto 130}${color}${diskio_read /dev/disk/by-uuid/04688feb-ffe7-4f39-aeae-334bdc222045}/s${alignr}${color}${diskio_write /dev/mapper/SN850}/s
 ${goto 10}${color1}SN570${goto 130}${color}${diskio_read /dev/disk/by-uuid/faba2d44-a7a9-4dd4-9542-75e98fc13360}/s${alignr}${color}${diskio_write /dev/mapper/SN570}/s
 ${goto 10}${color1}670p${goto 130}${color}${diskio_read /dev/disk/by-uuid/b7ad5472-3d25-4e7b-8e8f-bfdfa678f1a2}/s${alignr}${color}${diskio_write /dev/mapper/670p}/s
 ${goto 10}${color1}12TB${goto 130}${color}${diskio_read /dev/disk/by-uuid/fcadd4d9-57e5-436b-b6eb-81ef013e23ad}/s${alignr}${color}${diskio_write /dev/mapper/12TB}/s
 ${goto 10}${color1}10TB${goto 130}${color}${diskio_read /dev/disk/by-uuid/4ca40cc3-4564-4bc1-a5b7-580153bd17ab}/s${alignr}${color}${diskio_write /dev/mapper/10TB}/s
 ${goto 10}${color1}4TB${goto 130}${color}${diskio_read /dev/disk/by-uuid/63e001fd-26c8-4caa-9c30-5c1767420f43}/s${alignr}${color}${diskio_write /dev/mapper/4TB}/s
 
 ${color1}${goto 210}used${goto 265}total
 ${goto 10}${color1}/ ${goto 95}${color}${fs_type /} ${goto 202}${color}${fs_used /}${alignr}${fs_size /} ${color}${fs_bar 10,40 /}
 ${goto 10}${color1}SN850 ${goto 95}${color}${fs_type /mnt/SN850}${goto 155}${color}${execi 30 sudo nvme smart-log /dev/nvme0 | grep '^temperature'|cut -c 18-19}°C${goto 202}${color} ${fs_used /mnt/SN850}${alignr}${fs_size /mnt/SN850} ${color}${fs_bar 10,40 /mnt/SN850}
