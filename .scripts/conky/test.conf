conky.config = {


font = 'Liberation Mono Medium:size=10',
background = false,
cpu_avg_samples = 2,
diskio_avg_samples = 10,
double_buffer = true,
if_up_strictness = 'address',
net_avg_samples = 2,
no_buffers = true,
temperature_unit = 'celsius',
text_buffer_size = 2048,
update_interval = 1,
imlib_cache_size = 0,
alignment = 'top_left',
gap_x = 0,
gap_y = 0,
minimum_height = 600,
minimum_width = 350,
maximum_width = 350,
border_outer_margin = 1,
border_width = 1,
default_bar_width = 250,
default_bar_height = 10,
default_gauge_height = 25,
default_gauge_width = 40,
default_graph_height = 40,
default_graph_width = 153,
default_shade_color = '#000000',
default_outline_color = '#000000',
draw_borders = false,
draw_graph_borders = true,
draw_shades = false,
draw_outline = false,
stippled_borders = 0,
extra_newline = false,
format_human_readable = true,
max_text_width = 0,
max_user_text = 16384,
short_units = true,
top_name_width = 15,
top_name_verbose = false,
uppercase = false,
use_spacer = 'none',
use_xft = true,
xftalpha = 1,
own_window = true,
own_window_argb_value =230,
own_window_argb_visual = true,
own_window_class = 'Conky',
own_window_transparent = false,
own_window_title = 'system_conky',
own_window_type = 'desktop',
format_human_readable = true,

-- High-Intensity Everforest
    -- 1. BASE CONTAINERS
    own_window_colour = '#232a2e',
    default_color = 	'#7fbbb3',	-- dynamic text

    -- 2. ACCENT SLOTS
    color0 = 			'#8fbcbb',	-- SECTION HEADERS and lines
    color1 = 			'#d3c6aa',	-- label descriptors
    color2 = 			'#a7c080',
    color3 = 			'#d8dee9',

    -- 3. STATUS & GRAPH METRICS
    color5 = 			'#3a464c',	-- Muted container fills for graphs/bars
    color6 = 			'#e67e80',	-- Critical errors/high temp alerts

};

conky.text = [[
 ${goto 5}${color0}${font :size=12}SYSTEM${hr 3}${font Liberation Mono:regular:size=10}
 ${alignr}${color}${time}
 ${goto 10}${color1}Theme:${alignr}${color}Everforest
 ${goto 10}${color1}Hostname: ${alignr}${color}$nodename
 ${goto 10}${color1}Kernel: ${alignr}${color}$kernel
 ${goto 10}${color1}Uptime: ${alignr}${color}$uptime
 ${goto 10}${color1}Failed unit/services: ${goto 346}${color}${execi 60 sudo systemctl --failed|tail -1|awk '{print $1}'}

 ${goto 5}${color0}${font :size=12}CPU${hr 3}${font Liberation Mono:regular:size=10}
 ${goto 10}${color1}Freq.:${color} ${freq_g}${color1} GHz${alignr}${color1}Usage:${color} ${cpu cpu0}%
 ${goto 10}${color1}Package ID0: ${color}${hwmon coretemp temp 1}°C${goto 228}${color1}CPU fan: ${alignr}${color}${hwmon nct6687 fan 1}rpm
 ${goto 10}${alignr}${color5}${cpugraph 30,345}
 ${goto 10}${color1}Core 1 ${goto 70}${color}${cpu cpu1}%${goto 115}${freq 1}Mhz ${goto 190}${color1}Core 2${goto 255}${color}${cpu cpu2}% ${alignr}${freq 2}Mhz
 ${goto 10}${color1}Core 3 ${goto 70}${color}${cpu cpu3}%${goto 115}${freq 3}Mhz ${goto 190}${color1}Core 4${goto 255}${color}${cpu cpu4}% ${alignr}${freq 4}Mhz
 ${goto 10}${color1}Core 5 ${goto 70}${color}${cpu cpu5}%${goto 115}${freq 5}Mhz ${goto 190}${color1}Core 6${goto 255}${color}${cpu cpu6}% ${alignr}${freq 6}Mhz
 ${goto 10}${color1}Core 7 ${goto 70}${color}${cpu cpu7}%${goto 115}${freq 7}Mhz ${goto 190}${color1}Core 8${goto 255}${color}${cpu cpu8}% ${alignr}${freq 8}Mhz
 ${goto 10}${color1}Core 9 ${goto 70}${color}${cpu cpu9}%${goto 115}${freq 9}Mhz ${goto 190}${color1}Core 10${goto 255}${color}${cpu cpu10}% ${alignr}${freq 10}Mhz

 ${goto 10}${color1}Top Processes${goto 252}PID${alignr}CPU%
  ${goto 10}${color}${top name 1}${goto 220}${top pid 1}${alignr}${top cpu 1}
  ${goto 10}${color}${top name 2}${goto 220}${top pid 2}${alignr}${top cpu 2}
  ${goto 10}${color}${top name 3}${goto 220}${top pid 3}${alignr}${top cpu 3}

${goto 5}${color0}${font :size=12}MEMORY${hr 3}${font Liberation Mono:regular:size=10}
 ${goto 10}${color1}RAM:${goto 60}${color}${mem}${alignr}${color5}${membar 10}
 ${goto 10}${color1}Swap:${goto 60}${color}${swap}${alignr}${color5}${swapbar 10}
 
 ${goto 10}${color1}Top Processes${goto 192}PID${goto 250}CPU%${alignr}MEM
 ${goto 10}${color}${top_mem name 1}${goto 160}${top_mem pid 1}${goto 234}${top_mem cpu 1}${alignr}${top_mem mem_res 1}
 ${goto 10}${color}${top_mem name 2}${goto 160}${top_mem pid 2}${goto 234}${top_mem cpu 2}${alignr}${top_mem mem_res 2}
 ${goto 10}${color}${top_mem name 3}${goto 160}${top_mem pid 3}${goto 234}${top_mem cpu 3}${alignr}${top_mem mem_res 3}

${goto 5}${color0}${font :size=12}GPU${hr 3}${font Liberation Mono:regular:size=10}
 ${goto 10}${color1}fan speed: ${alignr}${color}${execi 5 amdgpu_top -d|grep 'Fan RPM (Current)'|awk '{print $5}'}rpm
 ${goto 10}${color1}hotspot temperature: ${alignr}${color}${execi 5 amdgpu_top -gm |grep temperature_hotspot|awk '{print $2}'|sed 's/,//'}°C
 ${goto 10}${color1}memory clock speed: ${alignr}${color}${execi 30 amdgpu_top -gm |awk 'FNR==28 {print $2}'|sed 's/,//'}MHz
 ${goto 10}${color1}memory usage: ${alignr}${color}${execi 5 amdgpu_top -d |grep VRAM|awk 'FNR==4 {print $4}'}MiB
 ${goto 10}${color1}power: ${alignr}${color}${execi 5 amdgpu_top -d|grep 'Power (Average)'|awk '{print $4}'}W
 ${goto 10}${color1}average GFX activity: ${alignr}${color}${execi 5 amdgpu_top -gm|grep 'average_gfx_activity'|awk '{print $2}'|sed 's/,//'}%

${goto 5}${color0}${font :size=12}FILE SYSTEM${hr 3}${font Liberation Mono:regular:size=10}
 ${goto 10}${color1}Total I/O:${goto 100}${color}${diskio}B/s
